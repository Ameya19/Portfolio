<header class="titlebar">
  <div class="nav-inner">
    <a class="brand" href="#home" (click)="navigateTo('home', $event)">Ameya Bhingarkar</a>

    <nav class="nav-links" [class.open]="menuOpen()" aria-label="Page sections">
      @for (link of navLinks; track link.fragment) {
        <a
          class="nav-link"
          [class.active]="activeSection() === link.fragment"
          [href]="'#' + link.fragment"
          (click)="navigateTo(link.fragment, $event)">
          {{ link.label }}
        </a>
      }
    </nav>

    <div class="nav-actions">
      <button
        class="theme-toggle"
        type="button"
        (click)="toggleTheme($event)"
        [attr.aria-label]="themeService.theme() === 'dark' ? 'Switch to neon theme' : 'Switch to dark theme'"
        [title]="themeService.theme() === 'dark' ? 'Switch to neon theme' : 'Switch to dark theme'">
        @if (themeService.theme() === 'dark') {
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
          </svg>
          <span class="theme-label">Neon</span>
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
          </svg>
          <span class="theme-label">Dark</span>
        }
      </button>

      <button
        class="menu-toggle"
        type="button"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()"
        aria-label="Toggle section menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>
</header>
